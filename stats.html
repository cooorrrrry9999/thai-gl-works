<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの統計 | Cory's GL Guide</title>

<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cory's GL Guide">
<meta property="og:title" content="みんなの統計 | Cory's GL Guide">
<meta property="og:description" content="Cory's GL Guideユーザーの視聴・評価データランキング。">
<meta property="og:url" content="https://thai-gl-works-2c835.web.app/stats.html">
<meta property="og:image" content="https://thai-gl-works-2c835.web.app/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@cory_fbshipper">
<meta name="twitter:image" content="https://thai-gl-works-2c835.web.app/ogp.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARPFANz5DZa6KpEBiw77PCCYPPZghMGeg",
  authDomain: "thai-gl-works-2c835.firebaseapp.com",
  projectId: "thai-gl-works-2c835",
  storageBucket: "thai-gl-works-2c835.firebasestorage.app",
  messagingSenderId: "71290080508",
  appId: "1:71290080508:web:f8b2c835e2f3c9a4d12345"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CACHE_KEY = 'glguide_stats_v1';
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 7日

async function loadDramas() {
  // まずJSONファイルから取得
  try {
    const ver = localStorage.getItem('glguide_dramas_ver') || '0';
    const res = await fetch('/data/dramas.json?v=' + ver);
    if (res.ok) {
      const arr = await res.json();
      if (arr && arr.length > 0) return arr;
    }
  } catch(e) {}
  // フォールバック：Firestore
  const snap = await getDocs(collection(db, 'dramas'));
  const arr = [];
  snap.forEach(d => arr.push({ _id: d.id, ...d.data() }));
  return arr;
}

async function init() {
  try {
    const dramas = await loadDramas();

    // 視聴済みTOP10
    const watchedTop = [...dramas]
      .filter(d => d.watch_count_watched > 0)
      .sort((a, b) => (b.watch_count_watched||0) - (a.watch_count_watched||0))
      .slice(0, 10);

    // 評価平均TOP10（3件以上評価されているもの）
    const rateTop = [...dramas]
      .filter(d => d.user_rate_avg > 0 && (d.user_rate_count||0) >= 1)
      .sort((a, b) => {
        if (b.user_rate_avg !== a.user_rate_avg) return b.user_rate_avg - a.user_rate_avg;
        return (b.user_rate_count||0) - (a.user_rate_count||0);
      })
      .slice(0, 10);

    renderWatchedChart(watchedTop);
    renderRateChart(rateTop);
    renderSummary(dramas);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').textContent = '読み込みに失敗しました';
  }
}

function renderSummary(dramas) {
  const totalWatched = dramas.reduce((s, d) => s + (d.watch_count_watched||0), 0);
  const totalRated   = dramas.reduce((s, d) => s + (d.user_rate_count||0), 0);
  const ratedDramas  = dramas.filter(d => d.user_rate_avg > 0).length;
  document.getElementById('stat-watched').textContent = totalWatched.toLocaleString();
  document.getElementById('stat-rated').textContent   = totalRated.toLocaleString();
  document.getElementById('stat-dramas').textContent  = dramas.length;
  document.getElementById('stat-rated-dramas').textContent = ratedDramas;
}

function renderWatchedChart(data) {
  const max = data[0]?.watch_count_watched || 1;
  const html = data.map((d, i) => {
    const pct = Math.round((d.watch_count_watched / max) * 100);
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
    return `
      <div class="rank-item" onclick="window.location.href='index.html?drama=${encodeURIComponent(d._id)}'">
        <div class="rank-num">${medal}</div>
        <div class="rank-img-wrap">
          ${d.image_url
            ? `<img src="${d.image_url}" alt="${d.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="rank-img-fallback" style="${d.image_url ? 'display:none' : ''}">${(d.title||'?')[0]}</div>
        </div>
        <div class="rank-info">
          <div class="rank-title">${d.title}</div>
          <div class="rank-kana">${d.title_kana||''}</div>
          <div class="rank-bar-wrap">
            <div class="rank-bar" style="width:${pct}%"></div>
          </div>
          <div class="rank-value">✅ 視聴済み <strong>${d.watch_count_watched}</strong>人</div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('watched-list').innerHTML = html;
}

function renderRateChart(data) {
  const html = data.map((d, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
    const stars = Math.round(d.user_rate_avg);
    const starsHtml = [1,2,3,4,5].map(n =>
      `<span style="color:${n<=stars?'#d4a843':'rgba(212,168,67,.2)'}">★</span>`
    ).join('');
    return `
      <div class="rank-item" onclick="window.location.href='index.html?drama=${encodeURIComponent(d._id)}'">
        <div class="rank-num">${medal}</div>
        <div class="rank-img-wrap">
          ${d.image_url
            ? `<img src="${d.image_url}" alt="${d.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="rank-img-fallback" style="${d.image_url ? 'display:none' : ''}">${(d.title||'?')[0]}</div>
        </div>
        <div class="rank-info">
          <div class="rank-title">${d.title}</div>
          <div class="rank-kana">${d.title_kana||''}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
            <span style="font-size:16px">${starsHtml}</span>
            <strong style="font-size:18px;color:var(--gold)">${d.user_rate_avg}</strong>
            <span style="font-size:11px;color:var(--muted)">(${d.user_rate_count}件)</span>
          </div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('rate-list').innerHTML = html;
}

init();
</script>

<style>
:root {
  --rose:#e8547a;--rl:#f0839e;
  --lav:#9b7ec8;--ll:#c4a8e8;
  --gold:#d4a843;--dark:#1a1220;--dark2:#251830;
  --text:#f0e8f8;--muted:#b09cc8;
  --card:#231630;--border:rgba(155,126,200,.2);
}
* { margin:0;padding:0;box-sizing:border-box; }
body {
  background:var(--dark);color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:14px;
  min-height:100vh;
}

/* ヘッダー */
.page-header {
  background:linear-gradient(135deg,var(--dark2),rgba(155,126,200,.15));
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
}
.back-btn {
  background:rgba(155,126,200,.1);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;color:var(--ll);
  cursor:pointer;font-size:12px;font-family:inherit;
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;
  transition:all .2s;
}
.back-btn:hover { background:rgba(155,126,200,.2); }
.header-title { font-size:18px;font-weight:700; }
.header-sub { font-size:11px;color:var(--muted);margin-top:2px; }

/* コンテンツ */
.container { max-width:800px;margin:0 auto;padding:24px 16px; }

/* サマリーカード */
.summary-grid {
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  margin-bottom:32px;
}
@media(min-width:480px) { .summary-grid { grid-template-columns:repeat(4,1fr); } }
.summary-card {
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;text-align:center;
}
.summary-num { font-size:28px;font-weight:700;color:var(--ll);line-height:1; }
.summary-label { font-size:11px;color:var(--muted);margin-top:4px; }

/* セクション */
.section { margin-bottom:40px; }
.section-header {
  display:flex;align-items:center;gap:8px;
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.section-icon { font-size:20px; }
.section-title { font-size:16px;font-weight:700; }
.section-sub { font-size:11px;color:var(--muted);margin-top:2px; }

/* ランキングアイテム */
.rank-item {
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:8px;
  cursor:pointer;transition:all .2s;
}
.rank-item:hover {
  border-color:rgba(155,126,200,.4);
  background:rgba(155,126,200,.08);
  transform:translateX(4px);
}
.rank-num {
  font-size:18px;font-weight:700;color:var(--muted);
  min-width:32px;text-align:center;
}
.rank-img-wrap {
  width:48px;height:68px;border-radius:6px;overflow:hidden;flex-shrink:0;
  background:rgba(155,126,200,.1);position:relative;
}
.rank-img-wrap img { width:100%;height:100%;object-fit:cover; }
.rank-img-fallback {
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--ll);
}
.rank-info { flex:1;min-width:0; }
.rank-title { font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.rank-kana { font-size:11px;color:var(--muted);margin-top:2px; }
.rank-bar-wrap {
  height:4px;background:rgba(155,126,200,.15);border-radius:2px;
  margin:8px 0 4px;overflow:hidden;
}
.rank-bar {
  height:100%;background:linear-gradient(90deg,var(--ll),var(--rose));
  border-radius:2px;transition:width .6s ease;
}
.rank-value { font-size:12px;color:var(--muted); }
.rank-value strong { color:var(--text); }

/* ローディング */
#loading {
  text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;
}
.loading-spinner {
  width:32px;height:32px;border:3px solid rgba(155,126,200,.2);
  border-top-color:var(--ll);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* 更新日時 */
.update-note {
  text-align:center;font-size:11px;color:var(--muted);
  margin-top:32px;padding-top:16px;border-top:1px solid var(--border);
}
</style>
</head>
<body>

<div class="page-header">
  <a class="back-btn" href="index.html">← 作品一覧へ</a>
  <div>
    <div class="header-title">📊 みんなの統計</div>
    <div class="header-sub">ユーザーの視聴・評価データ</div>
  </div>
</div>

<div id="loading">
  <div class="loading-spinner"></div>
  データを読み込み中...
</div>

<div id="content" style="display:none">
  <div class="container">

    <!-- サマリー -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-num" id="stat-watched">-</div>
        <div class="summary-label">✅ 総視聴済み数</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="stat-rated">-</div>
        <div class="summary-label">⭐ 総評価数</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="stat-dramas">-</div>
        <div class="summary-label">🎬 総作品数</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="stat-rated-dramas">-</div>
        <div class="summary-label">📊 評価済み作品数</div>
      </div>
    </div>

    <!-- 視聴済みTOP10 -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon">✅</div>
        <div>
          <div class="section-title">視聴済み人数 TOP10</div>
          <div class="section-sub">最もみんなに視聴されている作品</div>
        </div>
      </div>
      <div id="watched-list"></div>
    </div>

    <!-- 評価平均TOP10 -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon">⭐</div>
        <div>
          <div class="section-title">ユーザー評価平均 TOP10</div>
          <div class="section-sub">最も高く評価されている作品</div>
        </div>
      </div>
      <div id="rate-list"></div>
    </div>

    <div class="update-note">
      ※ 視聴・評価データは週1回更新されます
    </div>

  </div>
</div>

</body>
</html>
